<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Elemental Battlecards — juego de cartas estratégico basado en teoría de conjuntos." />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Elemental Battlecards" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Elemental Battlecards</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color-scheme: dark;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100vh;
            height: 100svh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        /* Asegura que el contenedor del juego y el formulario HTML se superpongan correctamente */
        /* Hacemos que el contenedor del juego ocupe toda la pantalla */
        #game-container {
            width: 100vw;
            height: 100vh;
            height: 100svh;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
            outline: none;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
        }
        #game-container canvas {
            display: block;
            touch-action: manipulation;
        }
        #orientation-screen {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: rgba(6, 9, 17, 0.96);
            color: #f2e9d3;
            text-align: center;
        }
        #orientation-screen .orientation-card {
            width: min(100%, 360px);
            padding: 28px 24px;
            border: 1px solid rgba(214, 180, 110, 0.5);
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(20, 28, 42, 0.96), rgba(11, 15, 25, 0.98));
        }
        #orientation-screen h1 { margin: 0 0 10px; font: 700 24px/1.2 Georgia, serif; }
        #orientation-screen p { margin: 0; color: #bcc7d7; font: 15px/1.55 Georgia, serif; }
        @media (orientation: portrait) and (max-width: 1100px) {
            #orientation-screen { display: flex; }
        }
        /* Pantalla de carga visible de inmediato mientras el bundle JS se descarga.
           #game-container la muestra y main.js la elimina cuando Phaser está listo. */
        #splash-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
            background: #050812 url('/assets/images/pantalla%20de%20carga/pantalla%20de%20carga.jpeg') center / cover no-repeat;
            animation: splash-arrive 0.3s ease 0.48s forwards;
        }
        #splash-screen::before,
        #splash-screen::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        #splash-screen::before {
            background: linear-gradient(180deg, rgba(3, 7, 16, 0.36), rgba(3, 7, 16, 0.66) 60%, rgba(3, 7, 16, 0.84));
        }
        #splash-screen::after {
            inset: 24% 22%;
            background: radial-gradient(ellipse, rgba(90, 196, 218, 0.14), transparent 68%);
            filter: blur(12px);
        }
        #splash-screen .splash-logo {
            position: relative;
            z-index: 1;
            width: min(58vw, 430px);
            height: auto;
            margin: 0 0 20px;
            filter: drop-shadow(0 0 22px rgba(223, 190, 113, 0.34));
            animation: splash-breathe 2.8s ease-in-out infinite;
        }
        #splash-screen .splash-subtitle {
            position: relative;
            z-index: 1;
            margin: 0 0 19px;
            color: #e6d6ad;
            font: 600 clamp(12px, 2vw, 16px)/1.4 Georgia, 'Times New Roman', serif;
            letter-spacing: 0.18em;
            text-align: center;
            text-shadow: 0 2px 12px #000;
        }
        #splash-screen .splash-orbit {
            position: relative;
            z-index: 1;
            width: clamp(48px, 8vw, 66px);
            height: clamp(48px, 8vw, 66px);
            border: 1px solid rgba(222, 190, 119, 0.48);
            border-radius: 50%;
            box-shadow: 0 0 24px rgba(75, 190, 211, 0.12), inset 0 0 18px rgba(75, 190, 211, 0.11);
            animation: splash-spin 11s linear infinite;
        }
        #splash-screen .splash-orbit::before,
        #splash-screen .splash-orbit::after {
            content: "";
            position: absolute;
            inset: 8px -5px;
            border: 1px solid rgba(89, 207, 224, 0.45);
            border-radius: 50%;
            transform: rotate(58deg);
        }
        #splash-screen .splash-orbit::after {
            transform: rotate(-58deg);
            border-color: rgba(224, 134, 83, 0.42);
        }
        #splash-screen .splash-orbit span {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            margin: -4px;
            border-radius: 50%;
            background: #69d7ec;
            box-shadow: 0 0 12px currentColor;
            color: #69d7ec;
        }
        #splash-screen .splash-orbit span:nth-child(1) { transform: translateY(-32px); }
        #splash-screen .splash-orbit span:nth-child(2) { transform: rotate(120deg) translateY(-32px); background: #f38b59; color: #f38b59; }
        #splash-screen .splash-orbit span:nth-child(3) { transform: rotate(240deg) translateY(-32px); background: #a6d881; color: #a6d881; }
        #splash-screen.fade-out {
            opacity: 0;
            animation: none;
            transition: opacity 0.35s ease;
        }
        @keyframes splash-spin {
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes splash-arrive {
            to { opacity: 1; }
        }
        @keyframes splash-breathe {
            0%, 100% { transform: scale(0.985); }
            50% { transform: scale(1.015); }
        }
        @media (prefers-reduced-motion: reduce) {
            #splash-screen .splash-logo,
            #splash-screen .splash-orbit { animation: none; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="splash-screen" aria-hidden="true">
            <img class="splash-logo" src="/assets/images/Logotipoletras.png" alt="" />
            <p class="splash-subtitle">RESTAURANDO TU AVENTURA</p>
            <div class="splash-orbit"><span></span><span></span><span></span></div>
        </div>
    </div>
    <div id="orientation-screen" role="status" aria-live="polite">
        <div class="orientation-card">
            <svg class="orientation-icon" viewBox="0 0 64 64" aria-hidden="true">
                <rect x="8" y="18" width="30" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(-90 23 41)" />
                <path d="M45 17a18 18 0 0 1 9 27M54 44l1-9m-1 9-9-1M19 47a18 18 0 0 1-9-27M10 20l-1 9m1-9 9 1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <h1>Gira tu dispositivo</h1>
            <p>Elemental Battlecards está diseñado para jugar en horizontal. Gira el teléfono o la tablet para continuar.</p>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>

</body>
</html>
